<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GB national wind generation for January 2026: the forecast available at day-ahead decision time against actual output, with error analysis."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Wind forecast monitor</title>
    <script>
      // Set the theme before first paint so a dark-mode visitor never sees a white flash.
      ;(function () {
        var t = null
        try {
          t = localStorage.getItem('theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
