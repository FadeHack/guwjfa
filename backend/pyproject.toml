[project]
name = "reint-backend"
version = "0.1.0"
description = "API serving UK wind generation forecasts and their accuracy (Elexon BMRS)"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.161.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "tzdata>=2026.5",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
